        }

            background: #1e3c72;

            text-align: center;

        }

            background: #fff8e1;

</head>

    <div class="container">

        <div class="kunci-section" id="kunciContainer">
            <h2>Kunci Jawaban &amp; Pembahasan</h2>
            <div id="kunciList"></div>
        </div>
    </div>

        // ========== FUNGSI RENDER SOAL ==========
        let semuaSoal = []; // {tipe, index, data}

            // Petunjuk

                    <li>Waktu pengerjaan: <strong>90 menit</strong>.</li>

        // ========== PENYIMPANAN JAWABAN ==========
        const jawabanSiswa = {
            pg: {},
            pgk: {},
            uraian: {}
        };

        function simpanJawaban(tipe, index, value) {
            jawabanSiswa[tipe][index] = value;
        }

        function simpanJawabanPGK(index) {
            const checkboxes = document.querySelectorAll(`input[name="pgk-${index}"]:checked`);
            jawabanSiswa.pgk[index] = Array.from(checkboxes).map(cb => cb.value).sort();
        }

        function simpanJawabanUraian(index) {
            const textarea = document.getElementById(`uraian-${index}`);
            jawabanSiswa.uraian[index] = textarea.value;
        }

        // ========== HITUNG SKOR ==========
        function hitungSkor() {
            let benarPG = 0, totalPG = soalPG.length;
            let benarPGK = 0, totalPGK = soalPGK.length;
            let skorUraian = 0, totalUraian = soalUraian.length;
            let detailPG = [];
            let detailPGK = [];

            // Hitung PG
            soalPG.forEach((s, i) => {
                const jawab = jawabanSiswa.pg[i];
                const benar = jawab === s.jawaban;
                if (benar) benarPG++;
                detailPG.push({ nomor: i + 1, jawab: jawab || '-', kunci: s.jawaban, benar });
            });

            // Hitung PGK (semua harus benar, tidak ada yang terlewat)
            soalPGK.forEach((s, i) => {
                const jawab = jawabanSiswa.pgk[i] || [];
                const kunci = [...s.jawaban].sort();
                const benar = jawab.length === kunci.length && jawab.every((v, idx) => v === kunci[idx]);
                if (benar) benarPGK++;
                detailPGK.push({ nomor: 26 + i, jawab: jawab.join(', ') || '-', kunci: kunci.join(', '), benar });
            });

            // Hitung uraian (penilaian sederhana: jawaban dianggap benar jika mengandung kata kunci utama)
            let detailUraian = [];
            soalUraian.forEach((s, i) => {
                const jawab = (jawabanSiswa.uraian[i] || '').toLowerCase();
                // Cek kata kunci sederhana dari pembahasan
                const kataKunci = s.jawaban.toLowerCase().split(/\s+/).filter(k => k.length > 4);
                let cocok = 0;
                kataKunci.forEach(k => {
                    if (jawab.includes(k)) cocok++;
                });
                const persenCocok = kataKunci.length > 0 ? cocok / kataKunci.length : 0;
                const nilai = persenCocok >= 0.3 ? 20 : (persenCocok >= 0.15 ? 10 : 0);
                skorUraian += nilai;
                detailUraian.push({ nomor: 31 + i, nilai, maksimal: 20 });
            });

            // Hitung total skor (PG: 25 soal × 2 = 50; PGK: 5 soal × 4 = 20; Uraian: 5 soal × 20 = 100 → total 170)
            // Kita normalisasi ke 100
            const skorPG = (benarPG / totalPG) * 50;
            const skorPGK = (benarPGK / totalPGK) * 20;
            const skorUraianFinal = (skorUraian / (totalUraian * 20)) * 30;
            const totalSkor = Math.round(skorPG + skorPGK + skorUraianFinal);

            // Tampilkan hasil
            document.getElementById('skorDisplay').textContent = totalSkor;
            document.getElementById('skorDetail').innerHTML = `
                <div class="skor-card">
                    <h3>Pilihan Ganda</h3>
                    <p>${benarPG} / ${totalPG}</p>
                </div>
                <div class="skor-card">
                    <h3>PG Kompleks</h3>
                    <p>${benarPGK} / ${totalPGK}</p>
                </div>
                <div class="skor-card">
                    <h3>Uraian</h3>
                    <p>${skorUraian} / ${totalUraian * 20}</p>
                </div>
            `;

            const feedback = document.getElementById('feedback');
            if (totalSkor >= 75) {
                feedback.className = 'feedback lulus';
                feedback.textContent = '🎉 Selamat! Anda LULUS dengan nilai ' + totalSkor + '. Pertahankan!';
            } else {
                feedback.className = 'feedback tidak-lulus';
                feedback.textContent = '📚 Nilai Anda ' + totalSkor + '. Silakan pelajari kembali materi Termokimia.';
            }

            document.getElementById('hasilContainer').style.display = 'block';
            document.getElementById('hasilContainer').scrollIntoView({ behavior: 'smooth' });

            // Tampilkan kunci jawaban
            tampilkanKunci(detailPG, detailPGK, detailUraian);
        }

        // ========== TAMPILKAN KUNCI ==========
        function tampilkanKunci(detailPG, detailPGK, detailUraian) {
            const kunciContainer = document.getElementById('kunciList');
            let html = '';

            // PG
            html += `<h3 style="color:#1e3c72;margin:15px 0 10px;">A. Pilihan Ganda</h3>`;
            soalPG.forEach((s, i) => {
                const d = detailPG[i];
                html += `<div class="kunci-item">
                    <strong>Soal ${i + 1}:</strong> Jawaban: ${d.kunci} 
                    ${d.jawab !== '-' ? `(Jawaban Anda: ${d.jawab})` : '(Tidak dijawab)'}
                    <span class="${d.benar ? 'badge-benar' : 'badge-salah'}">${d.benar ? '✓ Benar' : '✗ Salah'}</span>
                    <div class="pembahasan">📖 ${s.pembahasan}</div>
                </div>`;
            });

            // PGK
            html += `<h3 style="color:#7b1fa2;margin:20px 0 10px;">B. Pilihan Ganda Kompleks</h3>`;
            soalPGK.forEach((s, i) => {
                const d = detailPGK[i];
                html += `<div class="kunci-item" style="border-left-color:#7b1fa2;">
                    <strong>Soal ${26 + i}:</strong> Jawaban: ${d.kunci}
                    ${d.jawab !== '-' ? `(Jawaban Anda: ${d.jawab})` : '(Tidak dijawab)'}
                    <span class="${d.benar ? 'badge-benar' : 'badge-salah'}">${d.benar ? '✓ Benar' : '✗ Salah'}</span>
                    <div class="pembahasan">📖 ${s.pembahasan}</div>
                </div>`;
            });

            // Uraian
            html += `<h3 style="color:#2e7d32;margin:20px 0 10px;">C. Uraian</h3>`;
            soalUraian.forEach((s, i) => {
                const d = detailUraian[i];
                html += `<div class="kunci-item" style="border-left-color:#2e7d32;">
                    <strong>Soal ${31 + i}:</strong> Nilai: ${d.nilai}/20
                    <div class="pembahasan"><strong>Jawaban:</strong> ${s.jawaban}<br><br><strong>Pembahasan:</strong> ${s.pembahasan}</div>
                </div>`;
            });

            kunciContainer.innerHTML = html;
            document.getElementById('kunciContainer').style.display = 'block';
        }

        // ========== RESET ==========
        function resetUjian() {
            // Reset semua jawaban
            jawabanSiswa.pg = {};
            jawabanSiswa.pgk = {};
            jawabanSiswa.uraian = {};

            // Reset radio & checkbox
            document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
            document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
            document.querySelectorAll('.jawaban-uraian').forEach(t => t.value = '');

            // Sembunyikan hasil & kunci
            document.getElementById('hasilContainer').style.display = 'none';
            document.getElementById('kunciContainer').style.display = 'none';

            // Scroll ke atas
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ========== INISIALISASI ==========
        renderSoal();
    </script>
</body>
</html>
